name: maktabati
description: "مكتبتي الصفية الذكية — تقييم القراءة وتحفيز التلاميذ في المكتبات الصفية."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # قاعدة البيانات المحلية
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5

  # الملفات (Excel / PDF / الصور)
  file_picker: ^13.3.0
  archive: ^4.0.0
  xml: ">=6.5.0 <8.0.0"

  # التقارير والشهادات PDF + الطباعة + عرض صفحات PDF
  pdf: ^3.11.1
  printing: ^5.11.1

  # رموز QR
  mobile_scanner: ^7.1.0

  # تسجيل صوت الأستاذ للأسئلة وتشغيله
  record: ">=6.0.0 <8.0.0"
  audioplayers: ^6.5.0

  # الأمان والاتصال بالخادم الوسيط
  pointycastle: ">=3.9.0 <5.0.0"
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
